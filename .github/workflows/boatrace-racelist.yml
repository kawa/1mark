name: BOAT RACE racelist ingestion
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Race date YYYYMMDD"
        required: true
      jcd:
        description: "Venue code (02 = Toda)"
        required: true
        default: "02"
      rno:
        description: "Race number 1-12"
        required: true
        default: "1"
      scheduled_start:
        description: "Scheduled start, ISO-8601 with offset (enables prediction package)"
        required: false
      prediction_cutoff:
        description: "Prediction cutoff, ISO-8601 with offset, after fetch time and <= start"
        required: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, parse, validate
        env:
          IN_DATE: ${{ inputs.date }}
          IN_JCD: ${{ inputs.jcd }}
          IN_RNO: ${{ inputs.rno }}
        run: python -m onemark.boatrace --date "$IN_DATE" --jcd "$IN_JCD" --rno "$IN_RNO" --out-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatrace-${{ inputs.date }}-${{ inputs.jcd }}-${{ inputs.rno }}
          path: out/
          if-no-files-found: warn
      - name: Build and validate prediction package
        if: inputs.scheduled_start != '' && inputs.prediction_cutoff != ''
        env:
          IN_DATE: ${{ inputs.date }}
          IN_JCD: ${{ inputs.jcd }}
          IN_RNO: ${{ inputs.rno }}
          IN_START: ${{ inputs.scheduled_start }}
          IN_CUTOFF: ${{ inputs.prediction_cutoff }}
        run: |
          RNO=$(printf '%02d' "$((10#$IN_RNO))")
          python -m onemark.package --evidence "out/evidence-${IN_DATE}-${IN_JCD}-${RNO}.json" \
            --scheduled-start "$IN_START" --prediction-cutoff "$IN_CUTOFF" \
            --out "package/prediction-package-${IN_DATE}-${IN_JCD}-${RNO}.zip"
      - uses: actions/upload-artifact@v4
        if: inputs.scheduled_start != '' && inputs.prediction_cutoff != ''
        with:
          name: prediction-package-${{ inputs.date }}-${{ inputs.jcd }}-${{ inputs.rno }}
          path: package/
          if-no-files-found: error
