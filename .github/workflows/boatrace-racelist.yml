name: BOAT RACE racelist ingestion
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Race date YYYYMMDD"
        required: true
      jcd:
        description: "Venue code (02 = Toda)"
        required: true
        default: "02"
      rno:
        description: "Race number 1-12"
        required: true
        default: "1"
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, parse, validate
        env:
          IN_DATE: ${{ inputs.date }}
          IN_JCD: ${{ inputs.jcd }}
          IN_RNO: ${{ inputs.rno }}
        run: python -m onemark.boatrace --date "$IN_DATE" --jcd "$IN_JCD" --rno "$IN_RNO" --out-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatrace-${{ inputs.date }}-${{ inputs.jcd }}-${{ inputs.rno }}
          path: out/
          if-no-files-found: warn
